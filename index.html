    <h2>User Information Form</h2>

    <!-- HTML Form -->
    <form id="userForm">
      <label for="name">Name:</label><br />
      <input type="text" id="name" name="name" required /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="age">Age:</label><br />
      <input
        type="number"
        id="age"
        name="age"
        min="1"
        max="120"
        required
      /><br /><br />

      <input type="submit" value="Submit" />
    </form>

    <!-- Message Output -->
    <p id="message"></p>

    <script>
      document
        .getElementById("userForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent form from submitting to a server

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const age = parseInt(document.getElementById("age").value.trim(), 10);
          const messageEl = document.getElementById("message");

          // Basic validation
          if (!name || !email || isNaN(age)) {
            messageEl.textContent = "Please fill in all fields correctly.";
            messageEl.className = "error";
            return;
          }

          // Email format check (extra safety)
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email)) {
            messageEl.textContent = "Invalid email format.";
            messageEl.className = "error";
            return;
          }

          // Process data (example: display it)
          messageEl.textContent = `Hello ${name}, your email is ${email} and you are ${age} years old.`;
          messageEl.className = "success";

          // Optional: reset form after success
          // document.getElementById('userForm').reset();
        });
    </script>
